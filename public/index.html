<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tathmini CBC</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="center">
    <div class="card">
      <h1>Tathmini <span style="color:var(--accent)">CBC</span></h1>
      <p class="muted">Assessment records and termly report forms for CBC schools. Teachers enter scores in Google Sheets; the school analyses results and prints report forms.</p>
      <form id="signin">
        <label>School admin email <input type="email" name="email" required autocomplete="email"></label>
        <p><button type="submit">Email me a sign-in link</button></p>
      </form>
      <div id="msg"></div>
    </div>
  </div>
  <script src="/vendor/supabase.js"></script>
  <script src="/login.js"></script>
</body>
</html>
